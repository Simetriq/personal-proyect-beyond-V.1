
services:
  db:
    image: postgres:15-alpine
    container_name: anima_beyond_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: anima_beyond
    ports:
      - "5433:5432"
    volumes:
      - anima_db_data:/var/lib/postgresql/data

volumes:
  anima_db_data:
